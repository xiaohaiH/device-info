plugins {
    id 'com.android.application' version '8.12.0'
}

android {
    namespace 'com.gathin.deviceinfo'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.gathin.deviceinfo'
        minSdk 16
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            // Old Android needs JAR signing; recent Android with targetSdk >= 30 needs v2+.
            // Use this machine's default debug key for local diagnostic builds.
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doLast {
        def releaseApks = fileTree(dir: layout.buildDirectory.dir('outputs/apk/release').get().asFile,
                include: '*.apk', exclude: '*unsigned*').files
        if (releaseApks.size() != 1) {
            throw new GradleException('Expected exactly one signed release APK.')
        }
        def apk = releaseApks.iterator().next()
        [layout.projectDirectory.dir('dist'), layout.projectDirectory].each { destination ->
            project.copy {
                from apk
                into destination
                rename { 'device-info.apk' }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // JDK 21 warns about Java 8 itself, which is intentional for this legacy-compatible APK.
    options.compilerArgs += ['-Xlint:-options']
}
