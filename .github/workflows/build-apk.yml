name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check pull requests and other branches
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          .\test.ps1
          .\gradlew.bat --no-daemon --console=plain lintRelease

      - name: Build and verify signed APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          APK_SIGNING_KEYSTORE: ${{ secrets.APK_SIGNING_KEYSTORE }}
          DEVICE_INFO_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          if (!$env:APK_SIGNING_KEYSTORE -or !$env:DEVICE_INFO_SIGNING_PASSWORD) {
            throw 'Set APK_SIGNING_KEYSTORE and APK_SIGNING_PASSWORD in Actions Secrets.'
          }
          $env:DEVICE_INFO_SIGNING_KEYSTORE = Join-Path $env:RUNNER_TEMP 'device-info-signing.p12'
          try {
            [IO.File]::WriteAllBytes($env:DEVICE_INFO_SIGNING_KEYSTORE,
                [Convert]::FromBase64String($env:APK_SIGNING_KEYSTORE))
            .\build.ps1
          } finally {
            if (Test-Path -LiteralPath $env:DEVICE_INFO_SIGNING_KEYSTORE) {
              Remove-Item -LiteralPath $env:DEVICE_INFO_SIGNING_KEYSTORE
            }
          }

      - name: Upload APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: device-info-apk
          path: dist/device-info.apk
          if-no-files-found: error
